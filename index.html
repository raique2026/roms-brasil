<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMS BRASIL</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090e1c;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

a{
  text-decoration:none;
  color:inherit
}

header{
  background:#10172b;
  border-bottom:1px solid #202946
}

nav,main{
  max-width:1180px;
  margin:auto;
  padding:0 18px
}

.top{
  display:flex;
  gap:18px;
  align-items:center;
  padding:18px 0
}

.logo{
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer
}

.logo b{
  color:#29c36a
}

input{
  flex:1;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid #2b3555;
  background:#161e35;
  color:#fff;
  outline:none
}

.social a,
button,
.pill{
  padding:10px 14px;
  border-radius:999px;
  background:#1c2643;
  color:#fff;
  border:0
}

.filters{
  display:flex;
  gap:8px;
  padding-bottom:16px;
  flex-wrap:wrap
}

.active,
.download{
  background:#6959f5
}

.community{
  background:#151f3a;
  border:1px solid #283658;
  border-radius:18px;
  padding:22px;
  margin:38px 0 28px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center
}

.community h2{
  margin:0 0 6px
}

.community p{
  margin:0;
  color:#aab3cd
}

.community a{
  background:#fff;
  color:#111;
  padding:11px 16px;
  border-radius:999px;
  font-weight:bold;
  white-space:nowrap
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:18px
}

.card{
  background:#141c32;
  border:1px solid #242e4c;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer
}

.cover{
  background:#11182c;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}
.info{
  padding:14px
}

.info h3{
  margin:0 0 8px;
  font-size:15px
}

.meta{
  color:#aab3cd;
  font-size:12px
}

.back{
  display:inline-block;
  margin:28px 0 18px;
  color:#b9c2dd;
  cursor:pointer
}

.detail{
  display:grid;
  grid-template-columns:minmax(240px,330px) 1fr;
  gap:32px;
  padding-bottom:50px
}

.detail-cover img{
  width:100%;
  height:auto;
  display:block;
  border-radius:18px;
  object-fit:contain;
}

.detail-body h1{
  font-size:38px;
  margin:0 0 12px
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px
}

.pill{
  cursor:default;
  font-size:12px
}

.desc{
  color:#c0c7da;
  line-height:1.7
}

.specs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:25px 0
}

.spec{
  background:#141c32;
  border:1px solid #27304d;
  border-radius:14px;
  padding:14px
}

.spec small{
  display:block;
  color:#8f99b4;
  margin-bottom:5px
}

.download{
  display:inline-block;
  padding:11px 18px;
  border-radius:999px;
  font-weight:700
}

.screens-title{
  margin-top:36px
}

.shots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px
}

.shots img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #27304d;
  cursor:pointer;
  transition:transform .2s ease
}

.shots img:hover{
  transform:scale(1.02)
}

.no-shots{
  color:#8f99b4;
  margin-top:12px
}

/* VISUALIZADOR DE SCREENSHOTS */
.image-viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  padding:40px 70px
}

.image-viewer.active{
  display:flex
}

.image-viewer img{
  max-width:95vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 10px 50px rgba(0,0,0,.8)
}

.viewer-close,
.viewer-prev,
.viewer-next{
  position:absolute;
  border:0;
  background:rgba(20,28,50,.75);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.viewer-close{
  top:18px;
  right:24px;
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:30px
}

.viewer-prev,
.viewer-next{
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  font-size:28px
}

.viewer-prev{left:18px}
.viewer-next{right:18px}

.viewer-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,28,50,.8);
  padding:8px 12px;
  border-radius:999px;
  color:#fff;
  font-size:14px
}


/* CARROSSEL DE DESTAQUES */
.featured-wrap{
  position:relative;
  margin:28px 0 34px;
  overflow:hidden;
  border-radius:20px;
}

.featured-track{
  display:flex;
  align-items:stretch;
  gap:18px;
  transition:transform .7s ease;
  will-change:transform;
}

.featured-card{
  flex:0 0 76%;
  height:260px;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #2b3555;
  background:#141c32;
  cursor:pointer;
  opacity:.45;
  transform:scale(.94);
  transition:opacity .45s ease, transform .45s ease;
}

.featured-card.active{
  opacity:1;
  transform:scale(1);
}

.featured-card img{
  width:100%;
  height:100%;
  min-height:0;
  object-fit:cover;
  display:block;
}

.featured-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(7,12,25,.12) 35%,rgba(7,12,25,.9) 72%);
}

.featured-info{
  position:absolute;
  top:0;
  right:0;
  width:36%;
  height:100%;
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.featured-info h2{
  margin:0 0 10px;
  font-size:26px;
  line-height:1.15;
}

.featured-info p{
  margin:0 0 14px;
  color:#b9c3dc;
  line-height:1.45;
  font-size:14px;
}

.featured-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.featured-tags span{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

.featured-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:44px;
  height:44px;
  border-radius:50%;
  border:0;
  background:rgba(12,19,38,.78);
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.featured-prev{left:14px}
.featured-next{right:14px}

.featured-dots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:12px;
}

.featured-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#53617f;
  padding:0;
}

.featured-dot.active{
  background:#8b7cff;
}

@media(max-width:780px){
  .detail{grid-template-columns:1fr}
  .community{flex-direction:column;align-items:flex-start}
  .shots{grid-template-columns:1fr 1fr}
  .featured-card{flex-basis:88%;height:230px;min-height:0}
  .featured-card img{height:100%;min-height:0}
  .featured-info{width:48%;padding:18px}
  .featured-info h2{font-size:20px}
}

@media(max-width:620px){
  .top{flex-wrap:wrap}
  input{min-width:100%}
  .specs{grid-template-columns:1fr}
  .shots{grid-template-columns:1fr}
  .image-viewer{padding:35px 10px}
  .viewer-prev{left:8px}
  .viewer-next{right:8px}
}
</style>
</head>

<body>

<header>
<nav>

<div class="top" id="topBar">

  <div class="logo" onclick="goHome()">
    ROMS <b>BRASIL</b>
  </div>

  <input
    id="q"
    placeholder="Pesquisar jogos..."
  >

  <div class="social" id="socialX">
    <a
      href="https://x.com/museudosgames_"
      target="_blank"
      rel="noopener"
    >
      𝕏 Seguir no X
    </a>
  </div>

</div>

<div
  class="filters"
  id="filters"
></div>

</nav>
</header>

<main id="app"></main>

<!-- LIGHTBOX / VISUALIZADOR -->
<div id="imageViewer" class="image-viewer" onclick="closeScreenshot(event)">
  <button class="viewer-close" onclick="closeScreenshot()">×</button>
  <button class="viewer-prev" onclick="event.stopPropagation();prevScreenshot()">❮</button>

  <img
    id="viewerImage"
    src=""
    alt="Screenshot ampliado"
    onclick="event.stopPropagation()"
  >

  <button class="viewer-next" onclick="event.stopPropagation();nextScreenshot()">❯</button>
  <div id="viewerCounter" class="viewer-counter"></div>
</div>

<script>

/* =========================================================
   JOGOS DO SITE
   EDITE SOMENTE ESTA ÁREA
   ========================================================= */

const games = [

  {
    slug: "need-for-speed-most-wanted-black-edition",
    title: "Need for Speed: Most Wanted - Black Edition",
    platform: "PS2",
    year: "2005",
    language: "Portugues",
    region: "NTSC-U/C",
    size: "2.85 GB",
    developer: "EA Canada",
    publisher: "Electronic Arts",
    genre: "Corrida",
    format: "ISO",

    cover: "images/need-for-speed-most-wanted-black-edition.jpg",

    banner: "banners/need-for-speed-most-wanted-black-edition.jpg",

    description: "Need for Speed: Most Wanted - Black Edition é uma edição especial de Most Wanted, com conteúdos extras e foco em corridas de rua e perseguições policiais.",

    screenshots: [
      "screenshots/need-for-speed-most-wanted-black-edition/screenshot-01.png",
      "screenshots/need-for-speed-most-wanted-black-edition/screenshot-02.png",
      "screenshots/need-for-speed-most-wanted-black-edition/screenshot-03.png"
    ],

    download: "https://gofile.io/d/0FxG10Az"
  },

  {
  slug: "midnight-club-3-dub-edition-remix",
  title: "Midnight Club 3: DUB Edition Remix",
  platform: "PS2",
  year: "2006",
  language: "Portugues",
  region: "NTSC-U/C",
  size: "7.95 GB",
  developer: "Rockstar San Diego",
  publisher: "Rockstar Games",
  genre: "Corrida",
  format: "ISO",

  cover: "images/midnight-club-3-dub-edition-remix.jpg",

  banner: "banners/midnight-club-3-dub-edition-remix.png",

  description: "Midnight Club 3: DUB Edition Remix é uma versão expandida do jogo de corrida da Rockstar, com novos veículos, músicas, corridas e a cidade de Tóquio adicionada ao conteúdo original.",

  screenshots: [
    "screenshots/midnight-club-3-dub-edition-remix/screenshot-01.png",
    "screenshots/midnight-club-3-dub-edition-remix/screenshot-02.png",
    "screenshots/midnight-club-3-dub-edition-remix/screenshot-03.png"
  ],

  download: "#"
}

];

/* =========================================================
   FIM DOS JOGOS
   NÃO PRECISA EDITAR ABAIXO
   ========================================================= */

let currentPlatform = "Todos";

const app = document.getElementById("app");
const q = document.getElementById("q");
const filters = document.getElementById("filters");

let currentScreenshots = [];
let currentScreenshotIndex = 0;

let featuredIndex = 0;
let featuredTimer = null;

function updateFeatured(){

  const track = document.getElementById("featuredTrack");

  if(!track || games.length === 0){
    return;
  }

  const cards = [...track.querySelectorAll(".featured-card")];
  const dots = [...document.querySelectorAll(".featured-dot")];

  cards.forEach((card,index) => {
    card.classList.toggle("active", index === featuredIndex);
  });

  dots.forEach((dot,index) => {
    dot.classList.toggle("active", index === featuredIndex);
  });

  const card = cards[featuredIndex];

  if(!card){
    return;
  }

  const wrap = track.parentElement;
  const target =
    card.offsetLeft -
    (wrap.clientWidth - card.clientWidth) / 2;

  track.style.transform = `translateX(${-Math.max(0,target)}px)`;
}

function featuredNext(){
  if(games.length === 0) return;
  featuredIndex = (featuredIndex + 1) % games.length;
  updateFeatured();
  restartFeaturedTimer();
}

function featuredPrev(){
  if(games.length === 0) return;
  featuredIndex = (featuredIndex - 1 + games.length) % games.length;
  updateFeatured();
  restartFeaturedTimer();
}

function goToFeatured(index){
  featuredIndex = index;
  updateFeatured();
  restartFeaturedTimer();
}

function startFeaturedTimer(){
  clearInterval(featuredTimer);

  featuredTimer = setInterval(() => {
    if(document.getElementById("featuredTrack")){
      featuredIndex = (featuredIndex + 1) % games.length;
      updateFeatured();
    }
  }, 4500);
}

function restartFeaturedTimer(){
  startFeaturedTimer();
}

function placeholderCover(title){
  return "https://placehold.co/600x800/161e35/ffffff?text=" + encodeURIComponent(title);
}

function getCover(game){
  return game.cover || placeholderCover(game.title);
}

function renderFilters(){

  const platforms = [
    "Todos",
    ...new Set(games.map(game => game.platform))
  ];

  filters.innerHTML = platforms.map(platform => `
    <button
      class="${platform === currentPlatform ? "active" : ""}"
      onclick="setPlatform('${platform}')"
    >
      ${platform}
    </button>
  `).join("");

}

function setPlatform(platform){

  currentPlatform = platform;

  renderFilters();

  renderHome();

}

function goHome(){

  q.style.display = "";
  filters.style.display = "flex";

  document.getElementById("socialX").style.display = "";
  document.getElementById("topBar").style.justifyContent = "";

  renderHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function renderHome(){

  const search = q.value.toLowerCase().trim();

  const filteredGames = games.filter(game => {

    const matchesPlatform =
      currentPlatform === "Todos" ||
      game.platform === currentPlatform;

    const matchesSearch =
      game.title.toLowerCase().includes(search);

    return matchesPlatform && matchesSearch;

  });

  app.innerHTML = `

    <section class="featured-wrap">

      <button class="featured-arrow featured-prev" onclick="event.stopPropagation();featuredPrev()">❮</button>

      <div class="featured-track" id="featuredTrack">

        ${games.map((game,index) => `

          <article
            class="featured-card ${index === featuredIndex ? "active" : ""}"
            onclick="openGame('${game.slug}')"
          >

            <img
              src="${game.banner || getCover(game)}"
              alt="${game.title}"
            >

            <div class="featured-overlay"></div>

            <div class="featured-info">

              <h2>${game.title}</h2>

              <p>
                ${game.description}
              </p>

              <div class="featured-tags">
                <span>${game.platform}</span>
                <span>${game.genre}</span>
                <span>${game.language}</span>
              </div>

            </div>

          </article>

        `).join("")}

      </div>

      <button class="featured-arrow featured-next" onclick="event.stopPropagation();featuredNext()">❯</button>

      <div class="featured-dots">
        ${games.map((game,index) => `
          <button
            class="featured-dot ${index === featuredIndex ? "active" : ""}"
            onclick="event.stopPropagation();goToFeatured(${index})"
            aria-label="Ir para destaque ${index + 1}"
          ></button>
        `).join("")}
      </div>

    </section>

    <section class="grid">

      ${filteredGames.map(game => `

        <article
          class="card"
          onclick="openGame('${game.slug}')"
        >

          <div class="cover">

            <img
              src="${getCover(game)}"
              alt="${game.title}"
            >

          </div>

          <div class="info">

            <h3>
              ${game.title}
            </h3>

            <div class="meta">
              ${game.platform}
              •
              ${game.language}
              •
              ${game.year}
            </div>

          </div>

        </article>

      `).join("")}

    </section>

  `;

  requestAnimationFrame(() => {
    updateFeatured();
    startFeaturedTimer();
  });

}

function openGame(slug){

  clearInterval(featuredTimer);

  const game = games.find(
    item => item.slug === slug
  );

  if(!game) return;

  q.style.display = "none";
  filters.style.display = "none";

  document.getElementById("socialX").style.display = "none";
  document.getElementById("topBar").style.justifyContent = "center";

  let screenshotsHTML = "";

  if(
    game.screenshots &&
    game.screenshots.length > 0
  ){

    screenshotsHTML = `

      <h2 class="screens-title">
        Screenshots
      </h2>

      <div class="shots">

        ${game.screenshots.map((image,index) => `
          <img
            src="${image}"
            alt="${game.title}"
            onclick="openScreenshot('${game.slug}', ${index})"
          >
        `).join("")}

      </div>

    `;

  }else{

    screenshotsHTML = `

      <h2 class="screens-title">
        Screenshots
      </h2>

      <p class="no-shots">
        Nenhum screenshot adicionado.
      </p>

    `;

  }

  app.innerHTML = `

    <div
      class="back"
      onclick="goHome()"
    >
      ← Voltar ao catálogo
    </div>

    <section class="detail">

      <div class="detail-cover">

        <img
          src="${getCover(game)}"
          alt="${game.title}"
        >

      </div>

      <div class="detail-body">

        <h1>
          ${game.title}
        </h1>

        <div class="tags">

          <span class="pill">
            ${game.platform}
          </span>

          <span class="pill">
            ${game.genre}
          </span>

          <span class="pill">
            ${game.language}
          </span>

        </div>

        <p class="desc">
          ${game.description}
        </p>

        <div class="specs">

          ${[
            ["Plataforma",game.platform],
            ["Ano",game.year],
            ["Idioma",game.language],
            ["Região",game.region],
            ["Tamanho",game.size],
            ["Formato",game.format],
            ["Desenvolvedora",game.developer],
            ["Publicadora",game.publisher]
          ].map(item => `

            <div class="spec">

              <small>
                ${item[0]}
              </small>

              <strong>
                ${item[1]}
              </strong>

            </div>

          `).join("")}

        </div>

        <a
          class="download"
          href="${game.download}"
          target="_blank"
          rel="noopener"
        >
          ⬇ DOWNLOAD
        </a>

        ${screenshotsHTML}

      </div>

    </section>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function openScreenshot(slug,index){

  const game = games.find(item => item.slug === slug);

  if(!game || !game.screenshots || game.screenshots.length === 0){
    return;
  }

  currentScreenshots = game.screenshots;
  currentScreenshotIndex = index;

  updateScreenshotViewer();

  document
    .getElementById("imageViewer")
    .classList.add("active");

  document.body.style.overflow = "hidden";
}

function updateScreenshotViewer(){

  const image = document.getElementById("viewerImage");
  const counter = document.getElementById("viewerCounter");

  image.src = currentScreenshots[currentScreenshotIndex];

  counter.textContent =
    (currentScreenshotIndex + 1) +
    " / " +
    currentScreenshots.length;
}

function nextScreenshot(){

  if(currentScreenshots.length === 0) return;

  currentScreenshotIndex =
    (currentScreenshotIndex + 1) %
    currentScreenshots.length;

  updateScreenshotViewer();
}

function prevScreenshot(){

  if(currentScreenshots.length === 0) return;

  currentScreenshotIndex =
    (currentScreenshotIndex - 1 + currentScreenshots.length) %
    currentScreenshots.length;

  updateScreenshotViewer();
}

function closeScreenshot(event){

  const viewer = document.getElementById("imageViewer");

  if(
    event &&
    event.target !== viewer
  ){
    return;
  }

  viewer.classList.remove("active");

  document.getElementById("viewerImage").src = "";

  document.body.style.overflow = "";
}

document.addEventListener(
  "keydown",
  function(event){

    const viewer =
      document.getElementById("imageViewer");

    if(!viewer.classList.contains("active")){
      return;
    }

    if(event.key === "Escape"){
      closeScreenshot();
    }

    if(event.key === "ArrowRight"){
      nextScreenshot();
    }

    if(event.key === "ArrowLeft"){
      prevScreenshot();
    }

  }
);

q.addEventListener(
  "input",
  renderHome
);

renderFilters();

renderHome();

</script>

  <!-- VERCEL ANALYTICS -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>

<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
