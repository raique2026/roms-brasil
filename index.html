<!doctype html>
<!-- ROMS BRASIL BUILD: BLACK-FIRST-2026-09-14 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMS BRASIL</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090e1c;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

a{
  text-decoration:none;
  color:inherit
}

header{
  background:#10172b;
  border-bottom:1px solid #202946
}

nav,main{
  max-width:1180px;
  margin:auto;
  padding:0 18px
}

.top{
  display:flex;
  gap:18px;
  align-items:center;
  padding:18px 0
}

.logo{
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer
}

.logo b{
  color:#29c36a
}

input{
  flex:1;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid #2b3555;
  background:#161e35;
  color:#fff;
  outline:none
}

.social a,
button,
.pill{
  padding:10px 14px;
  border-radius:999px;
  background:#1c2643;
  color:#fff;
  border:0
}

.filters{
  display:flex;
  gap:10px;
  padding-bottom:16px;
  flex-wrap:wrap;
  align-items:center
}

.console-filter{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid #283658;
  background:#151f3a;
  color:#dbe3f7;
  cursor:pointer;
  font-weight:700;
  transition:.2s ease;
}

.console-filter:hover{
  transform:translateY(-2px);
  border-color:#586a9d
}

.console-filter.active{
  background:#6959f5;
  border-color:#6959f5;
  color:#fff
}

.console-icon{
  width:24px;
  height:24px;
  border-radius:50%;
  display:inline-grid;
  place-items:center;
  background:rgba(255,255,255,.08);
  font-size:10px;
  font-weight:900;
  letter-spacing:-.3px
}

.active,
.download{
  background:#6959f5
}

.community{
  background:#151f3a;
  border:1px solid #283658;
  border-radius:18px;
  padding:22px;
  margin:38px 0 28px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center
}

.community h2{
  margin:0 0 6px
}

.community p{
  margin:0;
  color:#aab3cd
}

.community a{
  background:#fff;
  color:#111;
  padding:11px 16px;
  border-radius:999px;
  font-weight:bold;
  white-space:nowrap
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:18px
}

.card{
  background:#141c32;
  border:1px solid #242e4c;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer
}

.cover{
  background:#11182c;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}
.info{
  padding:14px
}

.info h3{
  margin:0 0 8px;
  font-size:15px
}

.meta{
  color:#aab3cd;
  font-size:12px
}

.back{
  display:inline-block;
  margin:28px 0 18px;
  color:#b9c2dd;
  cursor:pointer
}

.detail{
  display:grid;
  grid-template-columns:minmax(240px,330px) 1fr;
  gap:32px;
  padding-top:48px;
  padding-bottom:50px
}

.detail-cover img{
  width:100%;
  height:auto;
  display:block;
  border-radius:18px;
  object-fit:contain;
}

.detail-body h1{
  font-size:38px;
  margin:0 0 12px
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px
}

.pill{
  cursor:default;
  font-size:12px
}

.desc{
  color:#c0c7da;
  line-height:1.7
}

.specs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:25px 0
}

.spec{
  background:#141c32;
  border:1px solid #27304d;
  border-radius:14px;
  padding:14px
}

.spec small{
  display:block;
  color:#8f99b4;
  margin-bottom:5px
}

.download{
  display:inline-block;
  padding:11px 18px;
  border-radius:999px;
  font-weight:700
}

.screens-title{
  margin-top:36px
}

.shots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px
}

.shots img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #27304d;
  cursor:pointer;
  transition:transform .2s ease
}

.shots img:hover{
  transform:scale(1.02)
}

.no-shots{
  color:#8f99b4;
  margin-top:12px
}

/* VISUALIZADOR DE SCREENSHOTS */
.image-viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  padding:40px 70px
}

.image-viewer.active{
  display:flex
}

.image-viewer img{
  max-width:95vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 10px 50px rgba(0,0,0,.8)
}

.viewer-close,
.viewer-prev,
.viewer-next{
  position:absolute;
  border:0;
  background:rgba(20,28,50,.75);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}

.viewer-close{
  top:18px;
  right:24px;
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:30px
}

.viewer-prev,
.viewer-next{
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  font-size:28px
}

.viewer-prev{left:18px}
.viewer-next{right:18px}

.viewer-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,28,50,.8);
  padding:8px 12px;
  border-radius:999px;
  color:#fff;
  font-size:14px
}


/* CARROSSEL DE DESTAQUES */
.featured-wrap{
  position:relative;
  margin:28px 0 34px;
  overflow:hidden;
  border-radius:20px;
}

.featured-track{
  display:flex;
  align-items:stretch;
  gap:18px;
  transition:transform .7s ease;
  will-change:transform;
}

.featured-card{
  flex:0 0 76%;
  height:260px;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #2b3555;
  background:#141c32;
  cursor:pointer;
  opacity:.45;
  transform:scale(.94);
  transition:opacity .45s ease, transform .45s ease;
}

.featured-card.active{
  opacity:1;
  transform:scale(1);
}

.featured-card img{
  width:100%;
  height:100%;
  min-height:0;
  object-fit:cover;
  display:block;
}

.featured-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(7,12,25,.12) 35%,rgba(7,12,25,.9) 72%);
}

.featured-info{
  position:absolute;
  top:0;
  right:0;
  width:36%;
  height:100%;
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.featured-info h2{
  margin:0 0 10px;
  font-size:26px;
  line-height:1.15;
}

.featured-info p{
  margin:0 0 14px;
  color:#b9c3dc;
  line-height:1.45;
  font-size:14px;
}

.featured-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.featured-tags span{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

.featured-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:44px;
  height:44px;
  border-radius:50%;
  border:0;
  background:rgba(12,19,38,.78);
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.featured-prev{left:14px}
.featured-next{right:14px}

.featured-dots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:12px;
}

.featured-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#53617f;
  padding:0;
}

.featured-dot.active{
  background:#8b7cff;
}



/* ÚLTIMOS JOGOS ADICIONADOS */
.latest-section{
  margin:34px 0 38px;
}

.latest-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}

.latest-header h2{
  margin:0;
  font-size:24px;
  letter-spacing:.3px;
}

.latest-controls{
  display:flex;
  gap:8px;
}

.latest-nav{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #2b3555;
  background:#151f3a;
  color:#fff;
  cursor:pointer;
  font-size:24px;
  display:grid;
  place-items:center;
}

.latest-nav:disabled{
  opacity:.35;
  cursor:default;
}

.latest-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
}

.latest-card{
  background:#141c32;
  border:1px solid #242e4c;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s ease,border-color .2s ease;
}

.latest-card:hover{
  transform:translateY(-4px);
  border-color:#566a9d;
}

.latest-cover{
  background:#11182c;
}

.latest-cover img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}

.latest-info{
  padding:12px;
}

.latest-info h3{
  margin:0 0 7px;
  font-size:14px;
  line-height:1.35;
}

.latest-meta{
  color:#aab3cd;
  font-size:12px;
}

@media(max-width:900px){
  .latest-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:620px){
  .latest-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .latest-header h2{
    font-size:20px;
  }
}


.latest-expand-wrap{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.latest-expand{
  min-width:145px;
  padding:12px 24px;
  border-radius:14px;
  border:2px solid #6959f5;
  background:transparent;
  color:#fff;
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
  cursor:pointer;
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
}

.latest-expand:hover{
  transform:translateY(-2px);
  background:#6959f5;
  border-color:#8b7cff;
}

/* RECOMENDAÇÕES ALEATÓRIAS NO FIM DA PÁGINA DO JOGO */
.recommended{
  margin-top:46px;
  padding:26px 0 10px;
  border-top:1px solid #202946;
}

.recommended h2{
  margin:0 0 20px;
  font-size:24px;
}

.recommended-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:18px;
}

.recommended-card{
  cursor:pointer;
  text-align:center;
}

.recommended-card img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  border-radius:12px;
  border:1px solid #27304d;
  background:#11182c;
  transition:transform .2s ease,border-color .2s ease;
}

.recommended-card:hover img{
  transform:translateY(-4px);
  border-color:#5d6fa8;
}

.recommended-card h3{
  margin:10px 4px 0;
  font-size:14px;
  line-height:1.35;
}

@media(max-width:900px){
  .recommended-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:780px){
  .detail{grid-template-columns:1fr}
  .community{flex-direction:column;align-items:flex-start}
  .shots{grid-template-columns:1fr 1fr}
  .featured-card{flex-basis:88%;height:230px;min-height:0}
  .featured-card img{height:100%;min-height:0}
  .featured-info{width:48%;padding:18px}
  .featured-info h2{font-size:20px}
}

@media(max-width:620px){
  .top{flex-wrap:wrap}
  .filters{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:14px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .console-filter{flex:0 0 auto}
  input{min-width:100%}
  .specs{grid-template-columns:1fr}
  .shots{grid-template-columns:1fr}
  .image-viewer{padding:35px 10px}
  .viewer-prev{left:8px}
  .viewer-next{right:8px}
}

/* ÍCONE DO X NO CABEÇALHO */
.social .x-icon{
  width:44px;
  height:44px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#1c2643;
  border:1px solid #2b3555;
  color:#fff;
  font-size:21px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
}

.social .x-icon:hover{
  background:#6959f5;
  border-color:#6959f5;
  transform:scale(1.08);
}


.social .x-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}


/* ===== MENU PRINCIPAL COM DROPDOWN ===== */
.filters{
  display:flex;
  align-items:center;
  gap:28px;
  padding-bottom:16px;
  position:relative;
  z-index:100;
  flex-wrap:wrap;
}

.main-menu-item{
  position:relative;
}

.main-menu-btn{
  padding:10px 0;
  border:0;
  border-radius:0;
  background:transparent;
  color:#8fd7ff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:color .2s ease;
}

.main-menu-btn:hover,
.main-menu-btn.active{
  color:#39d66f;
}

.menu-chevron{
  font-size:12px;
  transition:transform .2s ease;
}

.main-menu-item:hover .menu-chevron{
  transform:rotate(180deg);
}

.dropdown-menu{
  display:none;
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  min-width:320px;
  max-height:520px;
  overflow-y:auto;
  padding:12px 0;
  background:#171f2b;
  border:1px solid #263246;
  border-radius:14px;
  box-shadow:0 18px 45px rgba(0,0,0,.48);
  z-index:999;
}

.main-menu-item:hover .dropdown-menu,
.main-menu-item:focus-within .dropdown-menu{
  display:block;
}

.dropdown-menu button{
  display:block;
  width:100%;
  padding:13px 22px;
  border:0;
  border-radius:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  text-align:left;
  cursor:pointer;
}

.dropdown-menu button:hover{
  background:#202b3a;
  color:#39d66f;
}

@media(max-width:620px){
  .filters{
    flex-wrap:wrap;
    overflow:visible;
    gap:18px;
  }

  .dropdown-menu{
    min-width:260px;
    max-width:90vw;
  }
}


/* ===== PÁGINA DE EMULADORES ===== */
.emulators-section{
  padding:38px 0 50px;
}

.emulators-header{
  margin-bottom:24px;
}

.emulators-header h1{
  margin:0 0 8px;
  font-size:34px;
}

.emulators-header p{
  margin:0;
  color:#aab3cd;
  line-height:1.6;
}

.emulators-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
}

.emulator-card{
  background:#141c32;
  border:1px solid #27304d;
  border-radius:16px;
  padding:20px;
  transition:transform .2s ease,border-color .2s ease;
}

.emulator-card:hover{
  transform:translateY(-4px);
  border-color:#5d6fa8;
}

.emulator-icon{
  width:54px;
  height:54px;
  border-radius:14px;
  display:grid;
  place-items:center;
  margin-bottom:14px;
  background:#1c2643;
  font-weight:900;
  font-size:14px;
}

.emulator-card h3{
  margin:0 0 8px;
  font-size:20px;
  text-align:center;
}

.emulator-platform{
  color:#8fd7ff;
  font-size:14px;
  font-weight:700;
  margin-bottom:14px;
  text-align:center;
}

.emulator-card p{
  margin:0;
  color:#aab3cd;
  line-height:1.55;
  font-size:14px;
  text-align:left;
}


/* ===== CAPAS DOS EMULADORES ===== */
.emulator-card{
  cursor:pointer;
  overflow:hidden;
}

.emulator-cover{
  width:100%;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  background:#0f1628;
  margin-bottom:16px;
  border:1px solid #27304d;
}

.emulator-cover img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  padding:14px;
  box-sizing:border-box;
}

/* ===== PÁGINA INTERNA DO EMULADOR ===== */
.emulator-detail{
  padding:42px 0 54px;
}

.emulator-detail-grid{
  display:grid;
  grid-template-columns:minmax(280px,420px) 1fr;
  gap:34px;
  align-items:start;
}

.emulator-detail-image{
  background:#141c32;
  border:1px solid #27304d;
  border-radius:18px;
  overflow:hidden;
}

.emulator-detail-image img{
  width:100%;
  height:auto;
  display:block;
}

.emulator-detail-body h1{
  margin:0 0 10px;
  font-size:38px;
}

.emulator-detail-platform{
  color:#8fd7ff;
  font-weight:800;
  margin-bottom:18px;
}

.emulator-detail-desc{
  color:#b8c2da;
  line-height:1.7;
  margin-bottom:26px;
}

.emulator-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.emulator-download,
.emulator-bios{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:150px;
  padding:12px 20px;
  border-radius:999px;
  font-weight:900;
  text-decoration:none;
  cursor:pointer;
}

.emulator-download{
  background:#6959f5;
  color:#fff;
}

.emulator-bios{
  background:#151f3a;
  color:#fff;
  border:1px solid #2b3555;
}

.emulator-note{
  margin-top:18px;
  color:#8f99b4;
  font-size:13px;
  line-height:1.5;
}

@media(max-width:780px){
  .emulator-detail-grid{
    grid-template-columns:1fr;
  }
}


.pcsx2-bios-box{
  margin-top:28px;
  padding:20px;
  border:1px solid #27304d;
  border-radius:16px;
  background:#141c32;
}

.pcsx2-bios-box h2{
  margin:0 0 12px;
  font-size:22px;
}

.pcsx2-bios-box p{
  margin:0 0 12px;
  color:#b8c2da;
  line-height:1.65;
}

.pcsx2-bios-list{
  margin:10px 0 0;
  padding-left:18px;
  color:#d6def1;
}

.pcsx2-bios-list li{
  margin:7px 0;
}


/* ===== MODO CLARO / ESCURO ===== */
.theme-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;height:44px;padding:5px 6px 5px 14px;border:1px solid #2b3555;border-radius:999px;background:#1c2643;color:#fff;cursor:pointer;font-weight:700}
.theme-toggle-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#080d18;font-size:18px}
body.light-mode{background:#f4f6fb;color:#172033}
body.light-mode header{background:#fff;border-bottom-color:#dce2ee}
body.light-mode input{background:#f1f4fa;border-color:#d5dcea;color:#172033}
body.light-mode input::placeholder{color:#7b8498}
body.light-mode .main-menu-btn{color:#287eb1}
body.light-mode .main-menu-btn:hover,body.light-mode .main-menu-btn.active{color:#20b85b}
body.light-mode .dropdown-menu{background:#fff;border-color:#dce2ee;box-shadow:0 18px 45px rgba(35,48,75,.16)}
body.light-mode .dropdown-menu button{color:#172033}
body.light-mode .dropdown-menu button:hover{background:#eef3f8;color:#20a957}

/* ===== CONTROLE DO MODO CLARO / ESCURO ===== */
function applyTheme(theme){
  const isLight=theme==="light";
  document.body.classList.toggle("light-mode",isLight);
  const text=document.getElementById("themeText");
  const icon=document.getElementById("themeIcon");
  if(text) text.textContent=isLight?"Escuro":"Claro";
  if(icon) icon.textContent=isLight?"☀️":"🌙";
  localStorage.setItem("romsBrasilTheme",isLight?"light":"dark");
}
function toggleTheme(){
  applyTheme(document.body.classList.contains("light-mode")?"dark":"light");
}
applyTheme(localStorage.getItem("romsBrasilTheme")||"dark");




/* ===== CONTROLE DE MÚSICA DOS JOGOS ===== */
let gameAudio = null;
let currentMusicGame = null;
let gameMusicVolume = 0.015;

function stopGameMusic(){
  if(gameAudio){
    gameAudio.pause();
    gameAudio.currentTime = 0;
    gameAudio = null;
  }
  currentMusicGame = null;
}

function playGameMusic(game){
  stopGameMusic();

  if(!game || !game.music){
    return;
  }

  currentMusicGame = game.slug;
  gameAudio = new Audio(game.music);
  gameAudio.volume = gameMusicVolume;
  gameAudio.loop = true;
  gameAudio.preload = "auto";

  gameAudio.play()
    .then(updateMusicButton)
    .catch(() => {
      updateMusicButton();
    });
}

function toggleGameMusic(){
  if(!gameAudio){
    return;
  }

  if(gameAudio.paused){
    gameAudio.play().catch(() => {});
  }else{
    gameAudio.pause();
  }

  updateMusicButton();
}

function setGameMusicVolume(value){
  gameMusicVolume = Number(value);
  if(gameAudio){
    gameAudio.volume = gameMusicVolume;
  }
}

function updateMusicButton(){
  const button = document.getElementById("musicToggle");
  if(!button || !gameAudio){
    return;
  }

  button.innerHTML = gameAudio.paused
    ? "▶ Música"
    : "⏸ Música";
}

function chooseRandomFeaturedGames(){

  const shuffled = [...games];

  for(let i = shuffled.length - 1; i > 0; i--){

    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [shuffled[i], shuffled[j]] =
      [shuffled[j], shuffled[i]];

  }

  featuredGames = shuffled.slice(
    0,
    Math.min(3, shuffled.length)
  );

  featuredIndex = 0;
  featuredPosition =
    featuredGames.length > 1 ? 1 : 0;
}

function getFeaturedSlides(){

  if(featuredGames.length === 0){
    return [];
  }

  if(featuredGames.length === 1){
    return [
      { game: featuredGames[0], logicalIndex: 0 }
    ];
  }

  return [
    {
      game: featuredGames[featuredGames.length - 1],
      logicalIndex: featuredGames.length - 1
    },

    ...featuredGames.map((game,index) => ({
      game,
      logicalIndex:index
    })),

    {
      game: featuredGames[0],
      logicalIndex:0
    }
  ];
}

function setFeaturedTransform(animate = true){

  const track =
    document.getElementById("featuredTrack");

  if(!track){
    return;
  }

  const cards = [
    ...track.querySelectorAll(".featured-card")
  ];

  const dots = [
    ...document.querySelectorAll(".featured-dot")
  ];

  const card = cards[featuredPosition];

  if(!card){
    return;
  }

  cards.forEach((item,index) => {
    item.classList.toggle(
      "active",
      index === featuredPosition
    );
  });

  dots.forEach((dot,index) => {
    dot.classList.toggle(
      "active",
      index === featuredIndex
    );
  });

  const wrap = track.parentElement;

  const target =
    card.offsetLeft -
    (wrap.clientWidth - card.clientWidth) / 2;

  track.style.transition =
    animate
      ? "transform .7s ease"
      : "none";

  track.style.transform =
    `translateX(${-Math.max(0,target)}px)`;
}

function updateFeatured(animate = true){

  if(featuredGames.length === 0){
    return;
  }

  setFeaturedTransform(animate);
}

function normalizeFeaturedPosition(){

  if(featuredGames.length <= 1){
    return false;
  }

  let newPosition = null;
  let newIndex = null;

  if(featuredPosition === 0){

    newPosition = featuredGames.length;
    newIndex = featuredGames.length - 1;

  }else if(
    featuredPosition === featuredGames.length + 1
  ){

    newPosition = 1;
    newIndex = 0;

  }else{

    return false;
  }

  const track =
    document.getElementById("featuredTrack");

  if(!track){
    return false;
  }

  const cards = [
    ...track.querySelectorAll(".featured-card")
  ];

  /*
    Desliga TODAS as animações por um instante.
    Assim a troca do slide-clone para o slide real
    acontece exatamente no mesmo lugar, sem o "pulo".
  */
  track.style.transition = "none";

  cards.forEach(card => {
    card.style.transition = "none";
  });

  featuredPosition = newPosition;
  featuredIndex = newIndex;

  setFeaturedTransform(false);

  /* força o navegador a aplicar a posição sem animação */
  void track.offsetWidth;

  return true;
}

function featuredNext(){

  if(
    featuredGames.length === 0 ||
    featuredAnimating
  ){
    return;
  }

  if(featuredGames.length === 1){
    return;
  }

  featuredAnimating = true;

  featuredPosition++;
  featuredIndex =
    (featuredIndex + 1) % featuredGames.length;

  updateFeatured(true);
  restartFeaturedTimer();
}

function featuredPrev(){

  if(
    featuredGames.length === 0 ||
    featuredAnimating
  ){
    return;
  }

  if(featuredGames.length === 1){
    return;
  }

  featuredAnimating = true;

  featuredPosition--;
  featuredIndex =
    (featuredIndex - 1 + featuredGames.length) %
    featuredGames.length;

  updateFeatured(true);
  restartFeaturedTimer();
}

function goToFeatured(index){

  if(
    featuredGames.length === 0 ||
    index < 0 ||
    index >= featuredGames.length
  ){
    return;
  }

  featuredIndex = index;

  featuredPosition =
    featuredGames.length === 1
      ? 0
      : index + 1;

  updateFeatured(true);
  restartFeaturedTimer();
}

function startFeaturedTimer(){

  clearInterval(featuredTimer);

  featuredTimer = setInterval(() => {

    if(
      document.getElementById("featuredTrack")
    ){
      featuredNext();
    }

  }, 4500);
}

function restartFeaturedTimer(){
  startFeaturedTimer();
}

function setupFeaturedLoop(){

  const track =
    document.getElementById("featuredTrack");

  if(!track){
    return;
  }

  track.addEventListener(
    "transitionend",
    function(event){

      /*
        IMPORTANTE:
        transitionend dos cards também "sobe" para o track.
        Sem este teste, o carrossel entende a animação do card
        como se fosse o fim do movimento principal e pode dar
        aquela sensação de ir e voltar.
      */
      if(
        event.target !== track ||
        event.propertyName !== "transform"
      ){
        return;
      }

      const wasReset =
        normalizeFeaturedPosition();

      requestAnimationFrame(() => {

        if(wasReset){

          const cards = [
            ...track.querySelectorAll(".featured-card")
          ];

          cards.forEach(card => {
            card.style.transition = "";
          });
        }

        track.style.transition =
          "transform .7s ease";

        featuredAnimating = false;
      });
    }
  );

  setFeaturedTransform(false);

  requestAnimationFrame(() => {
    track.style.transition =
      "transform .7s ease";
  });
}

window.addEventListener(
  "resize",
  function(){
    if(document.getElementById("featuredTrack")){
      setFeaturedTransform(false);
    }
  }
);

function getRandomRecommendations(currentSlug, limit = 5){

  const available = games.filter(
    game => game.slug !== currentSlug
  );

  for(let i = available.length - 1; i > 0; i--){

    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [available[i], available[j]] =
      [available[j], available[i]];

  }

  return available.slice(
    0,
    Math.min(limit, available.length)
  );
}

            `).join("")}

        </section>
      `
      : "";

  app.innerHTML = `

    <section class="detail">

      <div class="detail-cover">

        <img
          src="${getCover(game)}"
          alt="${game.title}"
        >

      </div>

      <div class="detail-body">

        <h1>
          ${game.title}
        </h1>

        <div class="tags">

          <span class="pill">
            ${game.platform}
          </span>

          <span class="pill">
            ${game.genre}
          </span>

          <span class="pill">
            ${game.language}
          </span>

        </div>

        <p class="desc">
          ${game.description}
        </p>

        <div class="specs">

          ${[
            ["Plataforma",game.platform],
            ["Ano",game.year],
            ["Idioma",game.language],
            ["Região",game.region],
            ["Tamanho",game.size],
            ["Formato",game.format],
            ["Desenvolvedora",game.developer],
            ["Publicadora",game.publisher],
            ["Tradução",game.translation || "Não informado"]
          ].map(item => `

            <div class="spec">

              <small>
                ${item[0]}
              </small>

              <strong>
                ${item[1]}
              </strong>

            </div>

          `).join("")}

        </div>

        <a
          class="download"
          href="${game.download}"
          target="_blank"
          rel="noopener"
        >
          ⬇ DOWNLOAD
        </a>

        ${game.music ? `
          <div class="music-player">
            <button
              id="musicToggle"
              class="music-toggle"
              type="button"
              onclick="toggleGameMusic()"
            >
              ⏸ Música
            </button>

            <span class="music-label">Som ambiente</span>

            <input
              class="music-volume"
              type="range"
              min="0"
              max="0.08"
              step="0.005"
              value="0.015"
              aria-label="Volume da música"
              oninput="setGameMusicVolume(this.value)"
            >
          </div>
        ` : ""}

        ${screenshotsHTML}

      </div>

    </section>

    ${recommendationsHTML}

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function openScreenshot(slug,index){

  const game = games.find(item => item.slug === slug);

  if(!game || !game.screenshots || game.screenshots.length === 0){
    return;
  }

  currentScreenshots = game.screenshots;
  currentScreenshotIndex = index;

  updateScreenshotViewer();

  document
    .getElementById("imageViewer")
    .classList.add("active");

  document.body.style.overflow = "hidden";
}

function updateScreenshotViewer(){

  const image = document.getElementById("viewerImage");
  const counter = document.getElementById("viewerCounter");

  image.src = currentScreenshots[currentScreenshotIndex];

  counter.textContent =
    (currentScreenshotIndex + 1) +
    " / " +
    currentScreenshots.length;
}

function nextScreenshot(){

  if(currentScreenshots.length === 0) return;

  currentScreenshotIndex =
    (currentScreenshotIndex + 1) %
    currentScreenshots.length;

  updateScreenshotViewer();
}

function prevScreenshot(){

  if(currentScreenshots.length === 0) return;

  currentScreenshotIndex =
    (currentScreenshotIndex - 1 + currentScreenshots.length) %
    currentScreenshots.length;

  updateScreenshotViewer();
}

function closeScreenshot(event){

  const viewer = document.getElementById("imageViewer");

  if(
    event &&
    event.target !== viewer
  ){
    return;
  }

  viewer.classList.remove("active");

  document.getElementById("viewerImage").src = "";

  document.body.style.overflow = "";
}

document.addEventListener(
  "keydown",
  function(event){

    const viewer =
      document.getElementById("imageViewer");

    if(viewer.classList.contains("active")){

      if(event.key === "Escape"){
        closeScreenshot();
      }

      if(event.key === "ArrowRight"){
        nextScreenshot();
      }

      if(event.key === "ArrowLeft"){
        prevScreenshot();
      }

      return;
    }

    if(
      event.key === "Escape" &&
      location.hash.startsWith("#game=")
    ){
      history.back();
    }

  }
);

window.addEventListener(
  "popstate",
  function(){

    if(location.hash.startsWith("#game=")){

      const slug = decodeURIComponent(
        location.hash.replace("#game=", "")
      );

      openGame(slug, false);

    }else if(location.hash.startsWith("#emulator=")){

      const slug = decodeURIComponent(
        location.hash.replace("#emulator=", "")
      );

      emulatorMode = true;
      renderFilters();
      openEmulator(slug, false);

    }else if(location.hash === "#emulators"){

      showEmulators(false);

    }else{

      goHome(false);

    }

  }
);

q.addEventListener(
  "input",
  function(){

    emulatorMode = false;
    renderFilters();
    renderHome();

  }
);

chooseRandomFeaturedGames();

renderFilters();

if(location.hash.startsWith("#game=")){

  const initialSlug = decodeURIComponent(
    location.hash.replace("#game=", "")
  );

  const initialGame = games.find(
    game => game.slug === initialSlug
  );

  if(initialGame){

    openGame(initialSlug, false);

  }else{

    history.replaceState(
      { page: "home" },
      "",
      location.pathname
    );

    renderHome();

  }

}else if(location.hash.startsWith("#emulator=")){

  const initialEmulatorSlug = decodeURIComponent(
    location.hash.replace("#emulator=", "")
  );

  const initialEmulator = emulators.find(
    emulator => emulator.slug === initialEmulatorSlug
  );

  if(initialEmulator){

    emulatorMode = true;
    renderFilters();
    openEmulator(initialEmulatorSlug, false);

  }else{

    showEmulators(false);

  }

}else if(location.hash === "#emulators"){

  showEmulators(false);

}else{

  renderHome();

}

</script>
