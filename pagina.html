<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FutScore | Detalhes</title><style>:root{color-scheme:dark;--bg:#0b1019;--panel:#151d29;--line:#2b3647;--blue:#2194ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);background:#111925;padding:18px max(18px,calc((100vw - 1100px)/2))}a{color:#8cc7ff;text-decoration:none}main{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{cursor:pointer;border:1px solid var(--line);border-radius:18px;padding:9px 15px;background:#1b2533;color:white}button.active{background:var(--blue);color:#061322;font-weight:750}.row{padding:12px 6px;border-bottom:1px solid var(--line)}.muted{color:#9caec3}.club{display:flex;align-items:center;gap:10px}.club img{width:28px;height:28px;object-fit:contain}table{width:100%;border-collapse:collapse;min-width:430px}td,th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line)}.scroll{overflow:auto}</style></head><body><header><a href="/">← FutScore · Voltar aos jogos</a></header><main><h1 id="title">Carregando...</h1><div id="content" class="card">Consultando informações da SportMonks...</div></main><script>
const params=new URLSearchParams(location.search),tipo=params.get("tipo"),id=Number(params.get("id")),title=document.getElementById("title"),content=document.getElementById("content");
const names={648:"Brasileirão Série A",651:"Brasileirão Série B",654:"Copa do Brasil",1122:"Libertadores",1116:"Sul-Americana"};
const pt={"goal":"Gol","yellowcard":"Cartão amarelo","yellow card":"Cartão amarelo","redcard":"Cartão vermelho","red card":"Cartão vermelho","substitution":"Substituição","offside":"Impedimento","corner":"Escanteio","var":"VAR","penalty":"Pênalti","own goal":"Gol contra"};
function text(v,tag="p",parent=content){const el=document.createElement(tag);el.textContent=String(v);parent.append(el);return el}
async function get(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();return j.data??j.response??j}finally{clearTimeout(timer)}}
function tabs(labels,render){const bar=document.createElement("div"),panel=document.createElement("div");bar.className="tabs";content.append(bar,panel);labels.forEach(label=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{[...bar.children].forEach(x=>x.classList.toggle("active",x===b));panel.replaceChildren();render(label,panel)};bar.append(b)});bar.firstChild.click()}
function club(p,parent=content){const a=document.createElement("a");a.className="club";a.href="/pagina.html?tipo=time&id="+p.id;if(p.image_path){const img=document.createElement("img");img.src=p.image_path;img.alt="";img.onerror=()=>img.remove();a.append(img)}a.append(document.createTextNode(p.name??"Clube"));parent.append(a)}
async function run(){
 if(!Number.isSafeInteger(id)||id<=0||!["partida","time","competicao"].includes(tipo))throw Error("Endereço inválido");
 if(tipo==="competicao"){
  if(!names[id])throw Error("Competição não disponível");
  title.textContent=names[id];content.replaceChildren();
  text("Página da competição · Classificação","h2");
  if(id!==648&&id!==651){text("A classificação desta competição ainda não está integrada. Os jogos estão disponíveis na página inicial.");return}
  const data=await get("/api/futscore/standings?season="+(id===648?26763:27198));const rows=(Array.isArray(data)?data:[]).filter(x=>x.position!=null&&x.participant).sort((a,b)=>a.position-b.position);
  if(!rows.length){text("Classificação indisponível.");return}
  const scroll=document.createElement("div");scroll.className="scroll";const table=document.createElement("table");const tr=document.createElement("tr");["#","Clube","P","J","V","E","D","SG"].forEach(v=>text(v,"th",tr));table.append(tr);
  const val=(r,t)=>r.details?.find(x=>x.type_id===t)?.value??"—";
  rows.forEach(r=>{const tr=document.createElement("tr");const cells=[r.position,r.participant.name,r.points,val(r,129),val(r,130),val(r,131),val(r,132),val(r,179)];cells.forEach((v,i)=>{const td=text(v,"td",tr);if(i===1){td.replaceChildren();club(r.participant,td)}});table.append(tr)});scroll.append(table);content.append(scroll);
 }else if(tipo==="partida"){
  const f=await get("/api/futscore/fixture?id="+id);const ps=Array.isArray(f.participants)?f.participants:[],home=ps.find(x=>x.meta?.location==="home"),away=ps.find(x=>x.meta?.location==="away");
  title.textContent=(home?.name??"Mandante")+" × "+(away?.name??"Visitante");content.replaceChildren();
  const head=document.createElement("div");head.style.cssText="display:flex;justify-content:space-around;gap:12px;align-items:center;flex-wrap:wrap";if(home)club(home,head);text(f.state?.name??"Partida","strong",head);if(away)club(away,head);content.append(head);
  const events=Array.isArray(f.events)?f.events:[],lineups=Array.isArray(f.lineups)?f.lineups:[],stats=Array.isArray(f.statistics)?f.statistics:[];
  tabs(["Resumo","Tempo Real","Escalações","Estatísticas"],(tab,p)=>{
   if(tab==="Resumo"){text("Situação: "+(f.state?.name??"Não informada"),"p",p);if(f.venue?.name)text("Estádio: "+f.venue.name,"p",p);text(events.length+" eventos registrados","p",p)}
   if(tab==="Tempo Real"){if(!events.length)text("Eventos não disponíveis.","p",p);events.slice().sort((a,b)=>(a.minute??0)-(b.minute??0)).forEach(e=>{const type=e.type?.name??e.type?.developer_name??e.info??"Evento",team=ps.find(x=>x.id===e.participant_id)?.name??"";text((e.minute??"—")+"' · "+(pt[type.toLowerCase()]??type)+" · "+(e.player?.name??"")+(team?" · "+team:""),"div",p).className="row"})}
   if(tab==="Escalações"){if(!lineups.length)text("Escalações não disponíveis.","p",p);lineups.forEach(x=>text((x.jersey_number??"")+" · "+(x.player?.display_name??x.player?.name??"Jogador"),"div",p).className="row")}
   if(tab==="Estatísticas"){if(!stats.length)text("Estatísticas não disponíveis.","p",p);stats.forEach(x=>text((x.type?.name??"Estatística")+" · "+(ps.find(p=>p.id===x.participant_id)?.name??"Equipe")+": "+(x.data?.value??x.value??"—"),"div",p).className="row")}
  });
 }else{
  title.textContent="Perfil do clube";content.replaceChildren();text("Perfil do clube · ID SportMonks: "+id);text("O acesso à página do clube já funciona. Dados completos, elenco e jogos dependem da integração do endpoint de equipes.");const a=document.createElement("a");a.href="/";a.textContent="Voltar às partidas";content.append(a)
 }
}
run().catch(e=>{title.textContent="Informações indisponíveis";content.replaceChildren();text("Não foi possível carregar esta página. "+e.message);const b=document.createElement("button");b.textContent="Tentar novamente";b.onclick=()=>{title.textContent="Carregando...";content.textContent="Consultando...";run().catch(()=>{content.textContent="Falha na consulta."})};content.append(b)});
</script></body></html>
