rtant}.timeline-event:after{left:-27px!important;right:auto!important}}

function text(v,tag="p",parent=content){const el=document.createElement(tag);el.textContent=String(v);parent.append(el);return el}
async function get(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();return j.data??j.response??j}finally{clearTimeout(timer)}}
function tabs(labels,render){const bar=document.createElement("div"),panel=document.createElement("div");bar.className="tabs";content.append(bar,panel);labels.forEach(label=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{[...bar.children].forEach(x=>x.classList.toggle("active",x===b));panel.replaceChildren();render(label,panel)};bar.append(b)});bar.firstChild.click()}

async function run(){
 if(!Number.isSafeInteger(id)||id<=0||!["partida","time","competicao"].includes(tipo))throw Error("Endereço inválido");
 if(tipo==="competicao"){
  if(!names[id])throw Error("Competição não disponível");
  title.textContent=names[id];content.replaceChildren();
  const leagueId=id;
  tabs(["Jogos","Classificação",...(leagueId===654||leagueId===1122||leagueId===1116?["Mata-mata"]:[]),"Detalhes"],(tab,p)=>{
   if(tab==="Detalhes"){text("Competição: "+names[leagueId],"h2",p);text("Resultados e classificação são consultados diretamente pela integração SportMonks.","p",p);return}
   if(tab==="Mata-mata"){
    text("Carregando confrontos oficiais...","p",p);
    const season={654:26784,1122:27897,1116:26785}[leagueId];

     if(!p.isConnected)return;p.replaceChildren();
     const rows=Array.isArray(payload)?payload:Array.isArray(payload?.data)?payload.data:[];
     const knock=rows.filter(f=>f.stage&&(/final|oitav|quart|semi|round of|knock|fase|playoff/i.test(f.stage.name??"")||f.aggregate_id!=null));
     if(!knock.length){text("Nenhum confronto de mata-mata confirmado na resposta da SportMonks.","p",p);return}
     const stages=new Map();knock.forEach(f=>{const key=f.stage?.name??"Mata-mata";if(!stages.has(key))stages.set(key,[]);stages.get(key).push(f)});
     for(const [stage,fixtures] of stages){
      text(stage,"h3",p);
      const ties=new Map();fixtures.forEach(f=>{const ps=Array.isArray(f.participants)?f.participants:[];const ids=ps.map(x=>x.id).sort((a,b)=>a-b).join("-");const key=f.aggregate_id!=null?"agg:"+f.aggregate_id:ids?"teams:"+ids:"fixture:"+f.id;if(!ties.has(key))ties.set(key,[]);ties.get(key).push(f)});

       const box=document.createElement("div");box.className="row";p.append(box);
       matches.sort((a,b)=>String(a.starting_at??"").localeCompare(String(b.starting_at??"")));
       matches.forEach(f=>{const ps=Array.isArray(f.participants)?f.participants:[],home=ps.find(x=>x.meta?.location==="home"),away=ps.find(x=>x.meta?.location==="away");const a=document.createElement("a");a.href="/pagina.html?tipo=partida&id="+f.id;a.style.display="block";const score=Array.isArray(f.scores)?f.scores:[];const goals=x=>score.find(y=>y.description==="CURRENT"&&Number(y.participant_id)===Number(x?.id))?.score?.goals;const h=goals(home),v=goals(away);a.textContent=(home?.name??ps[0]?.name??"Mandante")+" "+(h??"–")+" × "+(v??"–")+" "+(away?.name??ps[1]?.name??"Visitante")+(f.leg?" · "+f.leg:"");box.append(a)})
      }
     }
     if(payload?.complete===false)text("Parte dos jogos não foi retornada; os confrontos podem estar incompletos.","p",p)
    }).catch(()=>{if(p.isConnected){p.replaceChildren();text("Não foi possível consultar o mata-mata nesta temporada.","p",p)}});
    return
   }
   if(tab==="Classificação"){
    if(leagueId!==648&&leagueId!==651){text("Classificação por grupos ou mata-mata ainda não disponível nesta versão.","p",p);return}
    text("Carregando classificação...","p",p);
    get("/api/futscore/standings?season="+(leagueId===648?26763:27198)).then(data=>{
     if(!p.isConnected)return;p.replaceChildren();
     const raw=Array.isArray(data)?data:Array.isArray(data?.data)?data.data:[];
     const rows=raw.flatMap(x=>Array.isArray(x.standings)?x.standings:[x]).filter(x=>x.position!=null&&x.participant).sort((a,b)=>a.position-b.position);
     if(!rows.length){text("Classificação indisponível.","p",p);return}
     const scroll=document.createElement("div");scroll.className="scroll";const table=document.createElement("table");
     const tr=document.createElement("tr");["#","Clube","P","J","V","E","D","SG"].forEach(v=>text(v,"th",tr));table.append(tr);
     const val=(r,t)=>r.details?.find(x=>x.type_id===t)?.value??"—";
     rows.forEach(r=>{const tr=document.createElement("tr");const pos=Number(r.position);const color=leagueId===648?(pos<=4?"#e6c343":pos===5?"#f28c37":pos<=11?"#2194ff":pos>=17?"#e04e54":"transparent"):(pos<=2?"#39b77d":pos<=6?"#2194ff":pos>=17?"#e04e54":"transparent");tr.style.borderLeft="4px solid "+color;const sg=r.goal_difference??((Number.isFinite(Number(val(r,133)))&&Number.isFinite(Number(val(r,134))))?Number(val(r,133))-Number(val(r,134)):"—");[pos,r.participant.name,r.points??"—",r.played??val(r,129),r.won??val(r,130),r.draw??val(r,131),r.lost??val(r,132),sg].forEach((v,i)=>{const td=text(v,"td",tr);if(i===1){td.replaceChildren();club(r.participant,td)}});table.append(tr)});
     scroll.append(table);p.append(scroll)
    }).catch(()=>{if(p.isConnected){p.replaceChildren();text("Não foi possível carregar a classificação.","p",p)}});
    return
   }
   const dateBox=document.createElement("div");dateBox.className="tabs";p.append(dateBox);const results=document.createElement("div");p.append(results);
   const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"});let date=fmt.format(new Date()),seq=0;
   const change=(days)=>{const d=new Date(date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+days);date=d.toISOString().slice(0,10);load()};
   const prev=document.createElement("button");prev.textContent="‹ Anterior";prev.onclick=()=>change(-1);const label=document.createElement("strong");const next=document.createElement("button");next.textContent="Próximo ›";next.onclick=()=>change(1);dateBox.append(prev,label,next);
   async function load(){const n=++seq;label.textContent=date.split("-").reverse().join("/");results.textContent="Carregando jogos...";
    try{const data=await get("/api/futscore/fixtures?date="+date);if(n!==seq||!results.isConnected)return;results.replaceChildren();const rows=(Array.isArray(data)?data:Array.isArray(data?.data)?data.data:[]).filter(x=>Number(x.league_id)===leagueId);if(!rows.length){text("Nenhuma partida encontrada nesta data.","p",results);return}
    rows.sort((a,b)=>String(a.starting_at??"").localeCompare(String(b.starting_at??""))).forEach(f=>{const ps=Array.isArray(f.participants)?f.participants:[],home=ps.find(x=>x.meta?.location==="home"),away=ps.find(x=>x.meta?.location==="away");const a=document.createElement("a");a.href="/pagina.html?tipo=partida&id="+f.id;a.className="row";a.style.display="block";a.textContent=(home?.name??"Mandante")+" × "+(away?.name??"Visitante")+" · "+(f.state?.name??"Partida");results.append(a)})
    }catch(e){if(n===seq&&results.isConnected)results.textContent="Jogos indisponíveis. Tente outra data."}}
   load()
  });
 }else if(tipo==="partida"){
  const f=await get("/api/futscore/fixture?id="+id);const ps=Array.isArray(f.participants)?f.participants:[],home=ps.find(x=>x.meta?.location==="home"),away=ps.find(x=>x.meta?.location==="away");
  title.textContent=(home?.name??"Mandante")+" × "+(away?.name??"Visitante");content.replaceChildren();
  const board=document.createElement("section");board.className="scoreboard";
  const heading=text(f.league?.name??"FutScore · Partida","div",board);heading.className="scoreboard-top";
  const main=document.createElement("div");main.className="scoreboard-main";
  const side=(team)=>{const el=document.createElement("div");el.className="score-team";if(team)club(team,el);else text("Equipe","strong",el);return el};
  main.append(side(home));
  const score=document.createElement("div");score.className="score-number";
  const scores=Array.isArray(f.scores)?f.scores:[];
  const goal=(team)=>scores.find(x=>Number(x.participant_id)===Number(team?.id)&&x.description==="CURRENT")?.score?.goals;
  const h=goal(home),a=goal(away);score.textContent=h!=null&&a!=null?h+" : "+a:"– : –";main.append(score,side(away));board.append(main);
  const status=text(f.state?.name??"Situação não informada","div",board);status.className="score-status";
  if(f.starting_at)text("Início: "+f.starting_at,"div",board).className="score-status";
  content.append(board);
  const events=Array.isArray(f.events)?f.events:[],lineups=Array.isArray(f.lineups)?f.lineups:[],stats=Array.isArray(f.statistics)?f.statistics:[];
  tabs(["Resumo","Tempo Real","Escalações","Estatísticas"],(tab,p)=>{
   if(tab==="Resumo"){text("Situação: "+(f.state?.name??"Não informada"),"p",p);if(f.venue?.name)text("Estádio: "+f.venue.name,"p",p);text(events.length+" eventos registrados","p",p)}
   if(tab==="Tempo Real"){
    if(!events.length){text("Eventos não disponíveis.","p",p);return}
    const timeline=document.createElement("div");timeline.className="timeline";p.append(timeline);
    events.slice().sort((a,b)=>(a.minute??0)-(b.minute??0)||(a.extra_minute??0)-(b.extra_minute??0)).forEach(e=>{
     const raw=String(e.type?.name??e.type?.developer_name??e.info??"Evento"),kind=raw.toLowerCase();
     const who=e.player?.display_name??e.player?.name??e.player_name??"";
     const team=ps.find(x=>Number(x.id)===Number(e.participant_id));
     const box=document.createElement("div");box.className="timeline-event "+(Number(e.participant_id)===Number(away?.id)?"away":"home");
     if(kind.includes("goal"))box.classList.add("goal");if(kind.includes("yellow"))box.classList.add("card-yellow");if(kind.includes("red"))box.classList.add("card-red");
     const minute=e.minute!=null?e.minute+(e.extra_minute?"+"+e.extra_minute:"")+"'":"—";
     text(minute,"span",box).className="timeline-minute";
     const symbol=kind.includes("goal")?"⚽ ":kind.includes("yellow")?"🟨 ":kind.includes("red")?"🟥 ":kind.includes("substitution")?"🔄 ":kind.includes("var")?"📺 ":"";
     text(" "+symbol+(pt[kind]??raw),"div",box).className="timeline-type";
     if(who||team?.name)text([who,team?.name].filter(Boolean).join(" · "),"div",box).className="timeline-meta";
     timeline.append(box)
    })
   }
   if(tab==="Escalações"){if(!lineups.length)text("Escalações não disponíveis.","p",p);lineups.forEach(x=>text((x.jersey_number??"")+" · "+(x.player?.display_name??x.player?.name??"Jogador"),"div",p).className="row")}
   if(tab==="Estatísticas"){if(!stats.length){text("Estatísticas não disponíveis.","p",p);return}const groups=new Map();stats.forEach(x=>{const k=x.type?.name??x.type?.developer_name??"Estatística";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});for(const [name,items] of groups){const val=t=>{const x=items.find(y=>Number(y.participant_id)===Number(t?.id));const v=x?.data?.value??x?.value;return typeof v==="object"?v?.total??v?.value??null:v};const h=val(home),a=val(away);if(h==null&&a==null)continue;const wrap=document.createElement("div");wrap.className="stat-compare";const labels=document.createElement("div");labels.className="stat-values";text(h??"—","strong",labels);text(a??"—","strong",labels);wrap.append(labels);text(name,"div",wrap).className="stat-name";const hn=Number(String(h).replace("%","")),an=Number(String(a).replace("%",""));if(h!=null&&a!=null&&Number.isFinite(hn)&&Number.isFinite(an)&&hn>=0&&an>=0&&hn+an>0){const bar=document.createElement("div");bar.className="stat-bar";const left=document.createElement("span"),right=document.createElement("span");left.style.width=100*hn/(hn+an)+"%";right.style.width=100*an/(hn+an)+"%";bar.append(left,right);wrap.append(bar)}p.append(wrap)}}
  });
 }else{

  if(typeof team.image_path==="string"&&team.image_path.startsWith("https://")){const img=document.createElement("img");img.src=team.image_path;img.alt="Escudo do clube";img.style.cssText="width:78px;height:78px;object-fit:contain";img.onerror=()=>img.remove();head.append(img)}
  const info=document.createElement("div");text(team.name??"Clube","h2",info);
  if(team.short_code)text("Sigla: "+team.short_code,"p",info);
  if(team.founded)text("Fundação: "+team.founded,"p",info);
  head.append(info);content.append(head);
  tabs(["Visão geral","Jogos","Elenco"],(tab,p)=>{
   if(tab==="Visão geral"){
    if(team.venue?.name)text("Estádio: "+team.venue.name,"p",p);
    if(team.country?.name)text("País: "+team.country.name,"p",p);
    if(team.coaches?.length)team.coaches.forEach(c=>text("Técnico: "+(c.name??c.coach?.name??"Não informado"),"p",p));
    if(!team.venue?.name&&!team.country?.name&&!team.coaches?.length)text("Informações adicionais ainda não disponíveis na resposta da API.","p",p)
   }else if(tab==="Elenco"){
    const players=Array.isArray(team.players)?team.players:Array.isArray(team.squad)?team.squad:[];
    if(!players.length){text("A SportMonks não disponibilizou o elenco nesta consulta.","p",p);return}
    const groups=new Map();
    players.forEach(x=>{const position=x.position?.name??x.player?.position?.name??"Outros";if(!groups.has(position))groups.set(position,[]);groups.get(position).push(x)});
    for(const [position,items] of groups){text(position+" · "+items.length,"h3",p);items.forEach(x=>{const line=document.createElement("div");line.className="row club";const player=x.player??x;if(player.image_path){const img=document.createElement("img");img.src=player.image_path;img.alt="";img.onerror=()=>img.remove();line.append(img)}line.append(document.createTextNode((x.jersey_number??x.number??"")+" · "+(player.display_name??player.name??"Jogador")));p.append(line)})}
   }else{
    const controls=document.createElement("div");controls.className="tabs";const list=document.createElement("div");p.append(controls,list);
    let date=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()),seq=0;
    const prev=document.createElement("button"),next=document.createElement("button"),label=document.createElement("strong");prev.textContent="‹ Dia anterior";next.textContent="Próximo dia ›";controls.append(prev,label,next);
    const shift=n=>{const d=new Date(date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);date=d.toISOString().slice(0,10);load()};
    prev.onclick=()=>shift(-1);next.onclick=()=>shift(1);
    async function load(){const n=++seq;label.textContent=date.split("-").reverse().join("/");list.textContent="Buscando partidas do clube...";
     try{const data=await get("/api/futscore/fixtures?date="+date);if(n!==seq||!list.isConnected)return;list.replaceChildren();
      const rows=(Array.isArray(data)?data:Array.isArray(data?.data)?data.data:[]).filter(f=>(f.participants??[]).some(x=>Number(x.id)===id));
      if(!rows.length){text("Nenhuma partida do clube nesta data.","p",list);return}
      rows.forEach(f=>{const a=document.createElement("a");a.href="/pagina.html?tipo=partida&id="+f.id;a.style.display="block";a.className="row";a.textContent=(f.participants??[]).map(x=>x.name).join(" × ")+" · "+(f.state?.name??"Partida");list.append(a)})
     }catch(e){if(n===seq&&list.isConnected)list.textContent="Não foi possível carregar os jogos."}}
    load()
   }
  })
 }
}
run().catch(e=>{title.textContent="Informações indisponíveis";content.replaceChildren();text("Não foi possível carregar esta página. "+e.message);const b=document.createElement("button");b.textContent="Tentar novamente";b.onclick=()=>{title.textContent="Carregando...";content.textContent="Consultando...";run().catch(()=>{content.textContent="Falha na consulta."})};content.append(b)});
</script></body></html>
