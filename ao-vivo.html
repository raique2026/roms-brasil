<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ao vivo | FutScore</title><style>:root{color-scheme:dark;--blue:#2194ff;--bg:#0c111a;--panel:#161e2b;--line:#29364a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7fd;font:15px system-ui,sans-serif}header{background:#111925;padding:18px max(18px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between}header a{color:#dbeeff;text-decoration:none}.brand{font-size:23px;font-weight:850}.brand b{color:var(--blue)}main{max-width:1050px;margin:28px auto;padding:0 18px}h1{font-size:29px;margin:0 0 8px}.muted{color:#9fb1c7;font-size:13px}.league{background:#1b2b3d;border-left:3px solid var(--blue);padding:12px;margin:22px 0 7px;border-radius:8px;font-weight:750}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;text-decoration:none;color:inherit;padding:17px 15px;border-bottom:1px solid var(--line);background:var(--panel)}.match:hover{background:#202d3d}.team{display:flex;align-items:center;gap:9px;font-weight:650}.team.away{justify-content:flex-end;text-align:right}.team img{height:31px;width:31px;object-fit:contain}.score{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}.status{color:#ff7284;font-size:12px;font-weight:750;text-align:center}.empty{background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:12px;margin-top:20px}button{background:#1d324a;color:white;border:1px solid #31506c;border-radius:9px;padding:10px 15px;cursor:pointer}@media(max-width:600px){.team{font-size:12px}.team img{height:25px;width:25px}.match{gap:7px;padding:12px 8px}.score{font-size:18px}}</style></head><body><header><a class="brand" href="/">Fut<b>Score</b></a><a href="/">← Todos os jogos</a></header><main><h1>Partidas ao vivo</h1><p class="muted">Jogos das cinco competições do FutScore · atualização automática a cada 60 segundos</p><button id="refresh">Atualizar agora</button><div id="games" aria-live="polite"><div class="empty">Buscando partidas...</div></div><p id="updated" class="muted"></p></main><script>
const leagues={648:"Brasileirão Série A",651:"Brasileirão Série B",654:"Copa do Brasil",1122:"Libertadores",1116:"Sul-Americana"};
const live=new Set(["LIVE","INPLAY","1ST_HALF","2ND_HALF","HT","ET","PEN_LIVE","1H","2H","BREAK","EXTRA_TIME","PENALTIES"]);
const games=document.getElementById("games");let loading=false;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=String(txt);return e}
function teamSide(t,cls){const d=el("div","team "+cls);if(t?.image_path){const img=el("img");img.src=t.image_path;img.alt="";img.onerror=()=>img.remove();d.append(img)}d.append(el("span",null,t?.name??"Equipe"));return d}
async function load(){if(loading)return;loading=true;try{const date=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const r=await fetch("/api/futscore/fixtures?date="+date,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();const fixtures=Array.isArray(data)?data:Array.isArray(data.data)?data.data:[];const rows=fixtures.filter(f=>leagues[Number(f.league_id)]&&live.has(String(f.state?.developer_name??f.state?.short_name??f.state?.name??"").toUpperCase().replace(/ /g,"_")));games.replaceChildren();if(!rows.length){games.append(el("div","empty","Nenhuma partida ao vivo nas competições acompanhadas neste momento."));return}const grouped=new Map();rows.forEach(f=>{const id=Number(f.league_id);if(!grouped.has(id))grouped.set(id,[]);grouped.get(id).push(f)});for(const [id,items]of grouped){games.append(el("div","league",leagues[id]));items.forEach(f=>{const ps=Array.isArray(f.participants)?f.participants:[];const h=ps.find(p=>p.meta?.location==="home")??ps[0],a=ps.find(p=>p.meta?.location==="away")??ps[1];const scores=Array.isArray(f.scores)?f.scores:[];const goals=t=>scores.find(s=>Number(s.participant_id)===Number(t?.id)&&s.description==="CURRENT")?.score?.goals;const link=el("a","match");link.href="/pagina.html?tipo=partida&id="+encodeURIComponent(f.id);link.append(teamSide(h,"home"));const mid=el("div");mid.append(el("div","score",(goals(h)??"–")+" : "+(goals(a)??"–")));mid.append(el("div","status","AO VIVO"));link.append(mid,teamSide(a,"away"));games.append(link)})}}catch(e){games.replaceChildren(el("div","empty","Não foi possível atualizar os jogos. Tente novamente."))}finally{loading=false;document.getElementById("updated").textContent="Última tentativa: "+new Intl.DateTimeFormat("pt-BR",{timeStyle:"medium"}).format(new Date())}}
document.getElementById("refresh").onclick=load;load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
